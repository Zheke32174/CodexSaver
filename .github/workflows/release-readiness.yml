name: Release readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input build '.[test]'
      - name: Compile source
        run: python -m compileall -q codexsaver cli.py codexsaver_mcp.py tests
      - name: Run tests
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Inspect package boundary
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = sorted(Path('dist').iterdir())
          assert len(artifacts) == 2, artifacts
          wheel = next(path for path in artifacts if path.suffix == '.whl')
          sdist = next(path for path in artifacts if path.suffix == '.gz')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith('codexsaver/context.py') for name in names)
              assert any(name.endswith('.dist-info/METADATA') for name in names)
          with tarfile.open(sdist, 'r:gz') as archive:
              names = archive.getnames()
              assert any(name.endswith('/SECURITY.md') for name in names)
              assert any(name.endswith('/RELEASE_READINESS_CHECKPOINT.md') for name in names)
          print('\n'.join(str(path) for path in artifacts))
          PY
